<form [formGroup]="carForm" (ngSubmit)="onSubmit()" class="car-form">
  <h2>Car Details Form</h2>


  <!-- Make Field -->
  <mat-form-field>
    <label for="make">Make:</label>
    <input id="make" type="text" formControlName="make" placeholder="e.g. Toyota" />
  </mat-form-field>

  <!-- Model Field -->
  <mat-form-field>
    <label for="model">Model:</label>
    <input id="model" type="text" formControlName="model" placeholder="e.g. Corolla" />ZX
  </mat-form-field>
  

  <!-- Year Field -->
  <mat-form-field>
    <mat-hint>Optional</mat-hint>
    <label for="year">Year:</label>
    <input id="year" type="number" formControlName="year" placeholder="e.g. 2022" />
  </mat-form-field>

  <!-- Action Buttons -->
   @if (saveError(); as message) { <p role="alert">{{ message }}</p> }
  <div class="button-group">
    <button type="submit" [disabled]="saving()">
      {{ saving() ? 'Saving...' : 'Save car' }}
    </button>
    <a routerLink="/cars">Cancel</a>
  </div>

</form>
